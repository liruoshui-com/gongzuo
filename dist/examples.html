<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="共作本地交互原型：明确目标与个人选择，体验学习工具与有依据的工作简报。">
  <title>共作 · 我的工作台</title>
  <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%233653dd'/%3E%3Cpath d='M9 10v12h6M17 10v12h6' fill='none' stroke='white' stroke-width='3'/%3E%3C/svg%3E">
  <link rel="stylesheet" href="style.css">
  <script src="tool.js" defer></script><script src="app.js" defer></script><script src="webmcp.js" defer></script>
</head>
<body>
  <div class="app-shell">
    <aside class="sidebar" aria-label="项目导航">
      <a class="brand" href="./"><span class="brand-symbol" aria-hidden="true">共</span><span>共作<small>把想法落到实处</small></span></a>
      <button class="new-project" id="new-project"><span aria-hidden="true">＋</span> 新建一个任务</button>
      <div class="sidebar-label">我的项目 <span>仅此浏览器</span></div>
      <nav id="project-list" aria-label="已保存项目"></nav>
      <div class="sidebar-bottom"><span class="prototype-label">交互原型 0.1</span><p>还未接入 AI。<br>学习工具可以实际使用。</p><button class="text-button" id="about-button">了解当前能力</button></div>
    </aside>
    <main class="main">
      <header class="topbar"><div class="breadcrumb">我的工作台 <span>/</span> <strong id="crumb-title">新任务</strong></div><span id="save-status" class="save-status" role="status">草稿尚未保存</span></header>
      <div class="workspace">
        <div class="workspace-heading"><div><div class="eyebrow">交互原型 · 未接入 AI</div><h1 id="page-title">从你想做的事开始</h1></div><button id="export-project" class="button secondary">导出项目记录</button></div>
        <nav class="stepper" id="stepper" aria-label="协作步骤"></nav>
        <div class="work-grid"><section id="stage-content" class="stage" aria-label="当前步骤"></section><aside id="context-panel" class="context-panel" aria-label="任务与选择"></aside></div>
        <footer class="workspace-footer"><span>你的目标与选择，始终可以修改。</span><button class="text-button" id="usage-button">查看实际用量</button></footer>
      </div>
    </main>
  </div>
  <div class="toast" id="toast" role="status" hidden></div>
  <dialog id="info-dialog"><div class="dialog-head"><h2 id="dialog-title"></h2><button class="icon-button" id="close-dialog" aria-label="关闭">×</button></div><div id="dialog-body"></div></dialog>
</body>
</html>
